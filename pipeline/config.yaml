# Configuración del proceso de precios.
#
# Fuente: Osinergmin – SCOP "Últimos precios registrados", Excel actualizado ~cada 6 horas.
#   EVPC = Establecimientos de Venta al Público de Combustibles (grifos, estaciones de servicio,
#          gasocentros): ~5.700 establecimientos. ES LA QUE USA LA APP.
#   DMAY = Distribuidores Mayoristas (Petroperú, Repsol, Valero, Numay…): precio de venta a
#          otras empresas, no al conductor. No se publica en la app.
# {year} se reemplaza por el año actual (con respaldo al año anterior).
#
# Variables de entorno que sobrescriben: PRICES_URL, REGISTRY_URL.

sources:
  prices:
    url: "https://www.osinergmin.gob.pe/seccion/centro_documental/hidrocarburos/SCOP/SCOP-DOCS/{year}/Registro-precios/Ultimos-Precios-Registrados-EVPC.xlsx"
    format: "xlsx"
    encoding: "utf-8"
    delimiter: ""
  registry:
    # Opcional: archivo con coordenadas exactas por código Osinergmin (se une por station_id).
    # Sin él, la ubicación es aproximada (capital del distrito, ver data/distritos.csv).
    url: ""
    format: ""
    encoding: "utf-8"
    delimiter: ""

# Alias de columnas (se comparan normalizados: mayúsculas, sin tildes, sin espacios).
# El primero que exista gana.
columns:
  station_id: [CODIGO_OSINERG, CODIGO_OSINERGMIN, COD_OSINERGMIN, CODIGO, NRO_REGISTRO, REGISTRO]
  name: [NOMBRE_COMERCIAL, NOMBRE_ESTABLECIMIENTO]
  company: [RAZON, RAZON_SOCIAL, EMPRESA, TITULAR]
  brand: [MARCA]
  activity: [ACTIVIDAD]
  ruc: [RUC]
  address: [DIRECCION, DIRECCION_ESTABLECIMIENTO, DOMICILIO]
  department: [DEPARTAMENTO, REGION, DPTO]
  province: [PROVINCIA]
  district: [DISTRITO]
  lat: [LATITUD, LAT, COORDENADA_Y]
  lon: [LONGITUD, LON, LNG, COORDENADA_X]
  product_code: [COD_PRODUCTO, CODIGO_PRODUCTO]
  product: [PRODUCTO, NOMBRE_PRODUCTO, COMBUSTIBLE]
  price: [PRECIO_VENTA, PRECIO, PRECIO_DE_VENTA]
  date: [FCHA_REGISTRO, FECHA_REGISTRO, FECHA_VIGENCIA, FECHA]
  active: [PRODUCTO_ACTIVO]
