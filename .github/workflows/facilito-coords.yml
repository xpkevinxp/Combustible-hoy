name: Coordenadas Facilito

on:
  schedule:
    # Trimestral: día 1 de ene/abr/jul/oct a las 9:23 UTC (4:23 hora Lima).
    - cron: "23 9 1 1,4,7,10 *"
  push:  # TEMPORAL: para probar el scraper; quitar cuando esté listo
    paths: ["pipeline/combustible/facilito.py", ".github/workflows/facilito-coords.yml"]
  workflow_dispatch:
    inputs:
      discover:
        description: "Solo depurar: código de departamento a inspeccionar (ej. 240000 = Tumbes)"
        required: false

permissions:
  contents: write

jobs:
  coords:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright==1.48.0 && python -m playwright install --with-deps chromium

      - name: Inspeccionar respuestas de Facilito
        if: inputs.discover != '' || github.event_name == 'push'
        run: python -m combustible.facilito --discover "${{ inputs.discover || '240000' }}" --dump ../facilito-dump

      - uses: actions/upload-artifact@v4
        if: always() && (inputs.discover != '' || github.event_name == 'push')
        with:
          name: facilito-dump
          path: facilito-dump/
