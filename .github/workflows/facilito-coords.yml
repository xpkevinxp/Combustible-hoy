name: Coordenadas Facilito

# Actualiza pipeline/data/coordenadas.csv (ubicación exacta y nombre comercial de cada grifo)
# desde el mapa de Facilito. Las ubicaciones casi no cambian: basta una vez por trimestre.
# El proceso de precios (daily-prices.yml) lee ese archivo en cada corrida.

on:
  schedule:
    # Día 1 de enero, abril, julio y octubre a las 9:23 UTC (4:23 hora Lima).
    - cron: "23 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facilito-coords
  cancel-in-progress: false

jobs:
  coords:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Descargar coordenadas
        working-directory: pipeline
        run: python -m combustible.facilito --min-points 3000

      - name: Guardar en el repositorio si cambió
        run: |
          if git diff --quiet -- pipeline/data/coordenadas.csv; then
            echo "Sin cambios en coordenadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/coordenadas.csv
          git commit -m "Actualizar coordenadas de Facilito ($(date -u +%Y-%m-%d))"
          git push
