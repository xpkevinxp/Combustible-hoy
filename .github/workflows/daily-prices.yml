name: Precios diarios

on:
  schedule:
    # 13:00 UTC = 8:00 am Lima. Segunda corrida por si Osinergmin publica tarde.
    - cron: "0 13 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      prices_url:
        description: "URL del archivo de precios (vacío = variable PRICES_URL del repo)"
        required: false
      use_sample:
        description: "Publicar datos de ejemplo (para probar la app)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traer datos publicados anteriormente (historial)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add site FETCH_HEAD
            rm -f site/.git
          else
            mkdir -p site
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Tests del pipeline
        working-directory: pipeline
        run: python -m pytest -q

      - name: Generar JSON
        working-directory: pipeline
        env:
          PRICES_URL: ${{ inputs.prices_url || vars.PRICES_URL }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          MIN_STATIONS: ${{ vars.MIN_STATIONS || '100' }}
        run: |
          if [ "${{ inputs.use_sample }}" = "true" ]; then
            python -m combustible --site ../site --min-stations 1 \
              --prices tests/fixtures/precios_largo.csv --registry tests/fixtures/registro.csv
          elif [ -z "$PRICES_URL" ]; then
            echo "::error::Configura la variable de repositorio PRICES_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          else
            python -m combustible --site ../site
          fi

      - name: Publicar en GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Precios ${{ github.run_id }}"
