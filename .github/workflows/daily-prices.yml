name: Precios diarios

on:
  schedule:
    # Osinergmin actualiza el Excel ~cada 6 horas. 1:17, 7:17, 13:17, 19:17 UTC
    # (= 20:17, 2:17, 8:17, 14:17 hora Lima).
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      prices_url:
        description: "URL del archivo de precios (vacío = Osinergmin EVPC, ver pipeline/config.yaml)"
        required: false
      use_sample:
        description: "Publicar datos de ejemplo (para probar la app)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traer datos publicados anteriormente (historial)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add site FETCH_HEAD
            rm -f site/.git
          else
            mkdir -p site
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Tests del pipeline
        working-directory: pipeline
        run: python -m pytest -q

      - name: Generar JSON
        working-directory: pipeline
        env:
          PRICES_URL: ${{ inputs.prices_url || vars.PRICES_URL }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          MIN_STATIONS: ${{ vars.MIN_STATIONS || '3000' }}
        run: |
          if [ "${{ inputs.use_sample }}" = "true" ]; then
            python -m combustible --site ../site --min-stations 1 --prices tests/fixtures/evpc_muestra.xlsx
          else
            python -m combustible --site ../site
          fi

      - name: Publicar en GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Precios ${{ github.run_id }}"
